name: Build iOS (IPA sem assinatura)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Testes no simulador
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          for runtime, devs in data.items():
              if 'iOS' not in runtime: continue
              for d in devs:
                  if d['name'].startswith('iPhone') and d['isAvailable']:
                      print(d['udid']); sys.exit(0)
          sys.exit(1)
          ")
          echo "Simulador: $UDID"
          xcodebuild test \
            -project Planneria.xcodeproj \
            -scheme Planneria \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build para dispositivo (sem assinatura)
        run: |
          xcodebuild build \
            -project Planneria.xcodeproj \
            -scheme Planneria \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Planneria.app Payload/
          zip -qr Planneria.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Planneria-ipa
          path: Planneria.ipa
